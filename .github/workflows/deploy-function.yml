name: Deploy the server function

# Sends the console's server function to Supabase whenever it changes, so
# nobody has to copy and paste it into the Supabase dashboard any more.
# It needs one secret in this repository's settings: SUPABASE_ACCESS_TOKEN.
# The function keeps its name (dynamic-handler) and its own settings and
# secrets in Supabase; only its code is replaced. Run it by hand from the
# Actions tab with "Run workflow" if ever needed.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/home/**', '.github/workflows/deploy-function.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qjfutwulufvmhetztubt
      FUNCTION_NAME: dynamic-handler
    steps:
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The secret SUPABASE_ACCESS_TOKEN is not set in this repository. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Put the code where Supabase expects it
        # The code lives in supabase/functions/home, but the function in
        # Supabase is called dynamic-handler, so it is copied under that name.
        run: |
          mkdir -p "supabase/functions/$FUNCTION_NAME"
          cp supabase/functions/home/index.ts "supabase/functions/$FUNCTION_NAME/index.ts"
      - name: Deploy
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Done
        run: echo "The server function is live. Refresh the console to use it."
